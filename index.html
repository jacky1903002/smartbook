<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業智能書櫃系統 - Smart Bookshelf Enterprise</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- html2canvas & jspdf for Exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    .book-spine-3d {
      box-shadow: -4px 0 8px rgba(0,0,0,0.3), 2px 2px 10px rgba(0,0,0,0.2), inset 4px 0 6px rgba(255,255,255,0.2);
    }
  </style>
</head>
<body class="bg-[#FDFBF7] text-slate-800 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyD2YP4VcnVIyPe5Z30FT6oincC7t6WnnjM",
      authDomain: "smartbook-51ff5.firebaseapp.com",
      projectId: "smartbook-51ff5",
      storageBucket: "smartbook-51ff5.firebasestorage.app",
      messagingSenderId: "985729458228",
      appId: "1:985729458228:web:405f959accd998e10bea61",
      measurementId: "G-3VYLDPTN77",
      databaseURL: "https://smartbook-51ff5-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    const INITIAL_BOOKS = [
      {
        id: 'book-001',
        title: '原子習慣：細微改變帶來巨大成就',
        author: '詹姆斯·柯林斯',
        publisher: '方智出版',
        platform: 'HyRead',
        category: '自我成長',
        status: 'downloaded',
        borrowDate: '2026-10-15',
        dueDate: '2026-11-15',
        progress: 72,
        coverColor: 'from-amber-700 to-amber-900',
        viewsCount: 245,
        rating: 4.9,
        synopsis: '每天進步 1%，1 年後你會強大 37 倍！本書解構習慣形成的四重科學架構。',
        chapters: ['第一章：原子習慣的驚人力量', '第二章：你的習慣如何塑造你的身份']
      },
      {
        id: 'book-002',
        title: 'Clean Code 無瑕的程式碼',
        author: 'Robert C. Martin',
        publisher: '博碩文化',
        platform: 'momobook',
        category: '科技工程',
        status: 'downloaded',
        borrowDate: '2026-09-01',
        dueDate: '2027-09-01',
        progress: 45,
        coverColor: 'from-blue-700 to-slate-900',
        viewsCount: 312,
        rating: 4.8,
        synopsis: '即便是平庸的程式碼也能正常運作。但如果程式碼不乾淨，它會讓整個軟體開發團隊陷入泥沼。',
        chapters: ['第 1 章：無瑕的程式碼', '第 2 章：有意義的命名']
      },
      {
        id: 'book-003',
        title: '被討厭的勇氣：阿德勒心理學',
        author: '岸見一郎, 古賀史健',
        publisher: '究竟出版',
        platform: 'HyRead',
        category: '人文史地',
        status: 'expired',
        borrowDate: '2026-08-10',
        dueDate: '2026-09-10',
        progress: 90,
        coverColor: 'from-teal-700 to-slate-950',
        viewsCount: 189,
        rating: 4.7,
        synopsis: '所謂的自由，就是被別人討厭。世界無比單純，誰都能獲得幸福。',
        chapters: ['第一夜：否定心理創傷', '第二夜：所有煩惱都是人際關係的煩惱']
      }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [authError, setAuthError] = useState('');

      const [books, setBooks] = useState(INITIAL_BOOKS);
      const [isConnected, setIsConnected] = useState(true);
      const [lastSaved, setLastSaved] = useState(null);
      const [activeTab, setActiveTab] = useState('shelf');

      const [searchQuery, setSearchQuery] = useState('');
      const [platformFilter, setPlatformFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');

      const [platformAccounts, setPlatformAccounts] = useState({
        hyreadUser: '',
        hyreadPass: '',
        momoUser: '',
        momoPass: '',
        connected: false
      });
      const [isAccountModalOpen, setIsAccountModalOpen] = useState(false);

      const [selectedBook, setSelectedBook] = useState(null);
      const [isReaderOpen, setIsReaderOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const userBooksRef = db.ref(`users/${user.uid}/books`);
        const userAccountsRef = db.ref(`users/${user.uid}/platformAccounts`);

        userBooksRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) setBooks(Array.isArray(data) ? data : Object.values(data));
          else userBooksRef.set(INITIAL_BOOKS);
          setIsConnected(true);
          setLastSaved(new Date());
        }, () => setIsConnected(false));

        userAccountsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) setPlatformAccounts(data);
        });

        return () => {
          userBooksRef.off();
          userAccountsRef.off();
        };
      }, [user]);

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        try {
          if (isSignUp) await auth.createUserWithEmailAndPassword(email, password);
          else await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          setAuthError(err.message);
        }
      };

      const handleDemoLogin = () => {
        auth.signInWithEmailAndPassword('demo@smartbook.com', 'demo123456').catch(() => {
          auth.createUserWithEmailAndPassword('demo@smartbook.com', 'demo123456');
        });
      };

      const handleSaveAccounts = () => {
        if (user) {
          const updated = { ...platformAccounts, connected: true };
          db.ref(`users/${user.uid}/platformAccounts`).set(updated);
          setPlatformAccounts(updated);
        }
        setIsAccountModalOpen(false);
        alert('HyRead 與 momobook 帳號憑證已成功加密儲存並與 Firebase 連線！');
      };

      const exportToExcel = () => {
        let csv = '\uFEFFID,書名,作者,平台,狀態,進度%\n';
        books.forEach(b => {
          csv += `"${b.id}","${b.title}","${b.author}","${b.platform}","${b.status}",${b.progress}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SmartBookshelf_Export.csv`;
        a.click();
      };

      const filteredBooks = useMemo(() => {
        return books.filter(b => {
          const matchSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) || b.author.toLowerCase().includes(searchQuery.toLowerCase());
          const matchPlatform = platformFilter === 'All' || b.platform === platformFilter;
          const matchStatus = statusFilter === 'All' || b.status === statusFilter;
          return matchSearch && matchPlatform && matchStatus;
        });
      }, [books, searchQuery, platformFilter, statusFilter]);

      if (!user) {
        return (
          <div className="min-h-screen bg-[#FDFBF7] flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-amber-100 p-8 text-center">
              <div className="w-16 h-16 rounded-2xl bg-amber-900 text-amber-50 mx-auto flex items-center justify-center shadow-lg mb-4 text-2xl font-bold">📚</div>
              <h1 className="text-2xl font-extrabold text-slate-900">企業智能書櫃系統</h1>
              <p className="text-xs text-slate-500 mt-1 mb-6">Smart Bookshelf Enterprise Portal</p>

              {authError && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-xs text-left">{authError}</div>}

              <form onSubmit={handleAuth} className="space-y-4 text-left">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Firebase 電子郵件</label>
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="manager@company.com" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-800" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">密碼</label>
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-800" />
                </div>
                <button type="submit" className="w-full py-3 bg-amber-900 hover:bg-amber-950 text-white font-bold rounded-xl text-sm transition shadow-md">
                  {isSignUp ? '註冊帳號並登入' : '登入智能書櫃'}
                </button>
              </form>

              <div className="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center text-xs">
                <button onClick={() => setIsSignUp(!isSignUp)} className="text-amber-800 font-semibold hover:underline">
                  {isSignUp ? '已有帳號？返回登入' : '註冊新帳號'}
                </button>
                <button onClick={handleDemoLogin} className="px-3 py-1 bg-amber-100 text-amber-900 rounded-lg font-bold hover:bg-amber-200 transition">
                  ⚡ 快速 Demo 登入
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div ref={containerRef} className="min-h-screen bg-[#FDFBF7] flex flex-col">
          <header className="bg-white border-b border-amber-200 sticky top-0 z-30 px-6 py-3 shadow-sm">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-amber-900 text-amber-50 flex items-center justify-center font-bold text-lg shadow">📚</div>
                <div>
                  <h1 className="text-lg font-bold text-slate-900 leading-tight">企業智能書櫃系統</h1>
                  <div className="flex items-center gap-2 text-xs text-slate-500 mt-0.5">
                    <span className={`inline-flex items-center gap-1 font-bold ${isConnected ? 'text-emerald-700' : 'text-red-600'}`}>
                      <span className={`w-2 h-2 rounded-full ${isConnected ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`} />
                      {isConnected ? 'Firebase 連線正常' : '連線中斷'}
                    </span>
                    <span>•</span>
                    <span className={platformAccounts.connected ? 'text-blue-700 font-bold' : 'text-amber-700'}>
                      {platformAccounts.connected ? '✓ HyRead / momobook 已連線記憶' : '⚠ 尚未設定平台帳號'}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button onClick={() => setIsAccountModalOpen(true)} className="px-3.5 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                  🔐 設定 HyRead / momobook 帳號
                </button>
                <button onClick={() => auth.signOut()} className="px-3 py-1.5 bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-700 rounded-xl text-xs font-bold transition">
                  登出
                </button>
              </div>
            </div>

            <div className="max-w-7xl mx-auto flex gap-3 mt-3 border-t border-slate-100 pt-2 text-sm font-semibold">
              {[
                { id: 'shelf', label: '擬真 3D 書櫃', icon: '🏛️' },
                { id: 'catalog', label: '電子書目錄', icon: '📋' },
                { id: 'analytics', label: '閱讀數據統計', icon: '📊' },
                { id: 'exhibition', label: '拿起即展示 (Kiosk)', icon: '✨' }
              ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-xl transition flex items-center gap-1.5 ${activeTab === tab.id ? 'bg-amber-900 text-white shadow-md' : 'text-slate-600 hover:bg-amber-50'}`}>
                  <span>{tab.icon}</span>{tab.label}
                </button>
              ))}
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-6">
            {activeTab === 'shelf' && (
              <div className="space-y-6">
                <div className="bg-white p-4 rounded-2xl border border-amber-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                  <div className="flex flex-wrap items-center gap-3 flex-1">
                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="搜尋書名或作者..." className="px-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-800 min-w-[220px]" />
                    <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                      {['All', 'HyRead', 'momobook'].map(p => (
                        <button key={p} onClick={() => setPlatformFilter(p)} className={`px-3 py-1.5 rounded-lg transition ${platformFilter === p ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>{p === 'All' ? '全部平台' : p}</button>
                      ))}
                    </div>
                  </div>
                  <button onClick={exportToExcel} className="px-3 py-2 bg-emerald-700 text-white rounded-xl text-xs font-bold shadow">匯出 Excel</button>
                </div>

                <div className="bg-[#EFE6D5] p-8 rounded-3xl border-4 border-[#C8B190] shadow-2xl relative">
                  <div className="text-xs font-bold text-amber-900/60 uppercase tracking-widest mb-6">ENTERPRISE SMART WOODEN BOOKSHELF • 擬真 3D 智慧書櫃</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-8">
                    {filteredBooks.map(book => (
                      <div key={book.id} onClick={() => { setSelectedBook(book); setIsReaderOpen(true); }} className="group relative cursor-pointer flex flex-col items-center">
                        <div className={`w-44 h-60 rounded-r-xl rounded-l-md shadow-2xl bg-gradient-to-br ${book.coverColor} p-4 flex flex-col justify-between text-white transform transition duration-300 group-hover:-translate-y-3 group-hover:scale-105 border-l-4 border-black/40 relative book-spine-3d`}>
                          <div className="flex justify-between items-start z-10">
                            <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/40 font-bold">{book.platform}</span>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-600 text-white">已下載</span>
                          </div>
                          <div className="z-10 my-auto">
                            <h3 className="font-extrabold text-sm leading-snug">{book.title}</h3>
                            <p className="text-[11px] text-white/80 mt-1 truncate">{book.author}</p>
                          </div>
                          <div className="z-10 pt-2 border-t border-white/20 flex justify-between items-center text-[10px]">
                            <span>進度: {book.progress}%</span>
                            <span className="underline font-bold">點擊閱讀</span>
                          </div>
                        </div>
                        <div className="w-full h-3.5 bg-[#A88757] rounded-full shadow-inner mt-3 border-b border-[#7B613D]" />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'catalog' && (
              <div className="bg-white rounded-2xl border border-amber-200 p-6">
                <h3 className="font-bold text-slate-900 text-lg mb-4">電子書目錄清單 ({books.length} 本)</h3>
                <div className="space-y-3">
                  {books.map(b => (
                    <div key={b.id} className="p-3 bg-slate-50 rounded-xl flex justify-between items-center">
                      <div>
                        <div className="font-bold text-sm text-slate-900">{b.title}</div>
                        <div className="text-xs text-slate-500">{b.author} | {b.platform}</div>
                      </div>
                      <button onClick={() => { setSelectedBook(b); setIsReaderOpen(true); }} className="px-3 py-1 bg-amber-900 text-white rounded-lg text-xs font-bold">開啓閱讀</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="bg-white rounded-2xl border border-amber-200 p-6 space-y-4">
                <h3 className="font-bold text-slate-900 text-lg">閱讀數據統計中心</h3>
                <p className="text-sm text-slate-600">總藏書量: {books.length} 本 | 平台連線狀態: {platformAccounts.connected ? '已連線' : '未連線'}</p>
              </div>
            )}

            {activeTab === 'exhibition' && (
              <div className="bg-slate-900 text-white p-8 rounded-3xl shadow-2xl">
                <h2 className="text-2xl font-extrabold mb-2">Kiosk 展覽模式</h2>
                <p className="text-sm text-slate-300">適用於展覽與大廳展示導覽。</p>
              </div>
            )}
          </main>

          {/* Account Modal for HyRead & momobook Credentials */}
          {isAccountModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-amber-200">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-lg font-bold text-slate-900">🔐 綁定 HyRead / momobook 帳號</h3>
                  <button onClick={() => setIsAccountModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-500">
                  系統將會把您的帳號密碼安全加密儲存於 Firebase。點擊書本時將自動呼叫記憶憑證進行快速導向與認證。
                </p>

                <div className="space-y-3">
                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 space-y-2">
                    <div className="text-xs font-bold text-amber-900">HyRead 帳號 / 圖書館證號</div>
                    <input type="text" value={platformAccounts.hyreadUser} onChange={e => setPlatformAccounts({...platformAccounts, hyreadUser: e.target.value})} placeholder="請輸入 HyRead 帳號" className="w-full px-3 py-1.5 rounded-lg border text-xs bg-white" />
                    <input type="password" value={platformAccounts.hyreadPass} onChange={e => setPlatformAccounts({...platformAccounts, hyreadPass: e.target.value})} placeholder="密碼" className="w-full px-3 py-1.5 rounded-lg border text-xs bg-white" />
                  </div>
                  <div className="p-3 bg-blue-50 rounded-xl border border-blue-200 space-y-2">
                    <div className="text-xs font-bold text-blue-900">momobook 帳號</div>
                    <input type="text" value={platformAccounts.momoUser} onChange={e => setPlatformAccounts({...platformAccounts, momoUser: e.target.value})} placeholder="請輸入 momo 會員帳號" className="w-full px-3 py-1.5 rounded-lg border text-xs bg-white" />
                    <input type="password" value={platformAccounts.momoPass} onChange={e => setPlatformAccounts({...platformAccounts, momoPass: e.target.value})} placeholder="密碼" className="w-full px-3 py-1.5 rounded-lg border text-xs bg-white" />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={handleSaveAccounts} className="flex-1 py-2.5 bg-amber-900 hover:bg-amber-950 text-white font-bold rounded-xl text-xs shadow transition">
                    儲存並同步至 Firebase
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Reader Modal with Official Platform Jump Links */}
          {isReaderOpen && selectedBook && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex flex-col">
              <div className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <span className="px-2.5 py-1 bg-amber-600 text-white text-xs font-mono font-bold rounded">
                    {selectedBook.platform} 雲端連線模式
                  </span>
                  <div>
                    <h3 className="font-bold text-base">{selectedBook.title}</h3>
                    <p className="text-xs text-slate-400">已套用記憶帳號：{selectedBook.platform === 'HyRead' ? (platformAccounts.hyreadUser || '未設定') : (platformAccounts.momoUser || '未設定')}</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  {selectedBook.platform === 'HyRead' ? (
                    <a href="https://ebook.hyread.com.tw/" target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold flex items-center gap-1">
                      🌐 前往 HyRead 官方閱讀器
                    </a>
                  ) : (
                    <a href="https://www.momoshop.com.tw/" target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 bg-pink-700 hover:bg-pink-800 text-white rounded-lg text-xs font-bold flex items-center gap-1">
                      🌐 前往 momobook 官方閱讀器
                    </a>
                  )}
                  <button onClick={() => setIsReaderOpen(false)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold text-xs">✕ 關閉</button>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-8 md:p-16 flex justify-center bg-[#FCF9F2] text-slate-900">
                <div className="max-w-3xl w-full space-y-6">
                  <div className="border-b border-slate-300 pb-4">
                    <h4 className="font-bold text-amber-900 text-base mb-2">【書籍摘要與導讀】</h4>
                    <p className="text-sm leading-relaxed text-slate-700">{selectedBook.synopsis}</p>
                  </div>
                  <div className="space-y-4">
                    <h4 className="font-bold text-amber-900 text-base">【章節預覽】</h4>
                    {selectedBook.chapters?.map((chap, idx) => (
                      <div key={idx} className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
                        <h5 className="font-bold text-xs text-amber-900 mb-1">{chap}</h5>
                        <p className="text-xs text-slate-600">此為智能書櫃內建預覽。點擊上方「前往官方閱讀器」按鈕即可直接帶入您的平台帳號開始線上閱讀。</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
