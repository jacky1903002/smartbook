<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業智能書櫃系統 - Smart Bookshelf</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (Development Version with JSX support) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for Browser JSX Compiling -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase App & Database (Compat SDKs for single-file CDN usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-[#FDFBF7] text-slate-800 font-sans antialiased">

  <div id="root"></div>

  <!-- React App Code compiled by Babel -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- YOUR FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyD2YP4VcnVIyPe5Z30FT6oincC7t6WnnjM",
      authDomain: "smartbook-51ff5.firebaseapp.com",
      projectId: "smartbook-51ff5",
      storageBucket: "smartbook-51ff5.firebasestorage.app",
      messagingSenderId: "985729458228",
      appId: "1:985729458228:web:405f959accd998e10bea61",
      measurementId: "G-3VYLDPTN77",
      databaseURL: "https://smartbook-51ff5-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    // --- INITIAL BOOKS DATA ---
    const INITIAL_BOOKS = [
      {
        id: 'book-001',
        title: '原子習慣：細微改變帶來巨大成就',
        author: '詹姆斯·柯林斯',
        publisher: '方智出版',
        platform: 'HyRead',
        category: '自我成長',
        status: 'downloaded',
        borrowDate: '2026-10-15',
        dueDate: '2026-11-15',
        progress: 72,
        coverColor: 'from-amber-700 to-amber-900',
        synopsis: '每天進步1%，1年後你會強大37倍！本書解構習慣形成的四重科學架構。',
        chapters: ['第一章：原子習慣的驚人力量', '第二章：你的習慣如何塑造你的身份', '第三章：四個簡單步驟建立好習慣']
      },
      {
        id: 'book-002',
        title: 'Clean Code 無瑕的程式碼',
        author: 'Robert C. Martin',
        publisher: '博碩文化',
        platform: 'momobook',
        category: '科技工程',
        status: 'downloaded',
        borrowDate: '2026-09-01',
        dueDate: '2027-09-01',
        progress: 45,
        coverColor: 'from-blue-700 to-slate-900',
        synopsis: '即便是平庸的程式碼也能正常運作。但如果程式碼不乾淨，它會讓整個軟體開發團隊陷入泥沼。',
        chapters: ['第 1 章：無瑕的程式碼', '第 2 章：有意義的命名', '第 3 章：函式設計哲學']
      },
      {
        id: 'book-003',
        title: '被討厭的勇氣：阿德勒心理學',
        author: '岸見一郎, 古賀史健',
        publisher: '究竟出版',
        platform: 'HyRead',
        category: '人文史地',
        status: 'expired',
        borrowDate: '2026-08-10',
        dueDate: '2026-09-10',
        progress: 90,
        coverColor: 'from-teal-700 to-slate-950',
        synopsis: '所謂的自由，就是被別人討厭。世界無比單純，誰都能獲得幸福。人並非被過去的原因控制。',
        chapters: ['第一夜：否定心理創傷', '第二夜：所有煩惱都是人際關係的煩惱']
      },
      {
        id: 'book-004',
        title: '致富心態：關於個人財富與幸福的二十堂課',
        author: '摩根·豪瑟',
        publisher: '商業周刊',
        platform: 'momobook',
        category: '商業理財',
        status: 'downloaded',
        borrowDate: '2026-10-20',
        dueDate: '2027-10-20',
        progress: 88,
        coverColor: 'from-amber-600 to-yellow-900',
        synopsis: '理財不是一門硬科學，而是一門心理學。錢、風險與時間，決定了你最終的財務財富與心靈自由。',
        chapters: ['第一章：沒有人是瘋子', '第二章：運氣與風險的賽局']
      }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [authError, setAuthError] = useState('');

      const [books, setBooks] = useState(INITIAL_BOOKS);
      const [isConnected, setIsConnected] = useState(true);
      const [activeTab, setActiveTab] = useState('shelf');
      const [searchQuery, setSearchQuery] = useState('');
      const [platformFilter, setPlatformFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');

      const [platformAccounts, setPlatformAccounts] = useState({
        hyreadUser: 'user_hyread_demo',
        hyreadPass: '••••••••',
        momoUser: 'momo_vip_member',
        momoPass: '••••••••'
      });
      const [isAccountModalOpen, setIsAccountModalOpen] = useState(false);
      const [selectedBook, setSelectedBook] = useState(null);
      const [isReaderOpen, setIsReaderOpen] = useState(false);

      // Auth Listener
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
        });
        return () => unsubscribe();
      }, []);

      // Realtime DB Sync
      useEffect(() => {
        if (!user) return;
        const booksRef = db.ref(`users/${user.uid}/books`);
        booksRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setBooks(Array.isArray(data) ? data : Object.values(data));
          } else {
            booksRef.set(INITIAL_BOOKS);
          }
          setIsConnected(true);
        }, (err) => {
          setIsConnected(false);
        });
        return () => booksRef.off();
      }, [user]);

      const handleAuth = (e) => {
        e.preventDefault();
        setAuthError('');
        if (isSignUp) {
          auth.createUserWithEmailAndPassword(email, password)
            .catch(err => setAuthError(err.message));
        } else {
          auth.signInWithEmailAndPassword(email, password)
            .catch(err => setAuthError(err.message));
        }
      };

      const handleLogout = () => auth.signOut();

      const exportToExcel = () => {
        let csv = '\uFEFFID,書名,作者,平台,狀態,進度%\n';
        books.forEach(b => {
          csv += `"${b.id}","${b.title}","${b.author}","${b.platform}","${b.status}",${b.progress}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SmartBookshelf_Export.csv`;
        a.click();
      };

      const filteredBooks = useMemo(() => {
        return books.filter(b => {
          const matchSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              b.author.toLowerCase().includes(searchQuery.toLowerCase());
          const matchPlatform = platformFilter === 'All' || b.platform === platformFilter;
          const matchStatus = statusFilter === 'All' || b.status === statusFilter;
          return matchSearch && matchPlatform && matchStatus;
        });
      }, [books, searchQuery, platformFilter, statusFilter]);

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-amber-100 p-8 text-center">
              <h1 className="text-2xl font-bold text-slate-900 mb-2">企業智能書櫃系統</h1>
              <p className="text-xs text-slate-500 mb-6">Smart Bookshelf Enterprise Login</p>
              
              {authError && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-xs">{authError}</div>}

              <form onSubmit={handleAuth} className="space-y-4 text-left">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Firebase 電子郵件</label>
                  <input 
                    type="email" required value={email} onChange={e => setEmail(e.target.value)}
                    placeholder="name@company.com" 
                    className="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-800"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                  <input 
                    type="password" required value={password} onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••" 
                    className="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-800"
                  />
                </div>
                <button type="submit" className="w-full py-2.5 bg-amber-900 hover:bg-amber-950 text-white font-medium rounded-xl text-sm transition">
                  {isSignUp ? '註冊並登入' : '登入智能書櫃'}
                </button>
              </form>

              <button onClick={() => setIsSignUp(!isSignUp)} className="mt-4 text-xs text-amber-800 underline">
                {isSignUp ? '已有帳號？返回登入' : '沒有帳號？點此註冊'}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-amber-200 sticky top-0 z-30 px-6 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <h1 className="text-lg font-bold text-slate-900">企業智能書櫃系統</h1>
              <span className={`text-xs px-2 py-0.5 rounded ${isConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                {isConnected ? '● Firebase 連線正常' : '● 連線中斷'}
              </span>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={() => setIsAccountModalOpen(true)} className="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 rounded-lg text-xs font-medium">
                HyRead / momobook 帳號管理
              </button>
              <span className="text-xs text-slate-600">{user.email}</span>
              <button onClick={handleLogout} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs">登出</button>
            </div>
          </header>

          {/* Sub Navigation */}
          <div className="bg-white border-b border-slate-100 px-6 flex gap-4 text-sm font-medium">
            {['shelf', 'catalog', 'analytics', 'exhibition'].map(tab => (
              <button 
                key={tab} 
                onClick={() => setActiveTab(tab)}
                className={`py-3 border-b-2 capitalize ${activeTab === tab ? 'border-amber-900 text-amber-900 font-bold' : 'border-transparent text-slate-500'}`}
              >
                {tab === 'shelf' ? '擬真 3D 書櫃' : tab === 'catalog' ? '電子書目錄' : tab === 'analytics' ? '閱讀統計' : '展覽 Kiosk 模式'}
              </button>
            ))}
          </div>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6">
            {activeTab === 'shelf' && (
              <div className="space-y-6">
                {/* Search Toolbar */}
                <div className="bg-white p-4 rounded-2xl border border-amber-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                  <div className="flex gap-3 items-center flex-1">
                    <input 
                      type="text" 
                      value={searchQuery} 
                      onChange={e => setSearchQuery(e.target.value)}
                      placeholder="搜尋書名或作者..." 
                      className="px-4 py-1.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-800"
                    />
                    <div className="flex bg-slate-100 p-1 rounded-xl text-xs">
                      {['All', 'HyRead', 'momobook'].map(p => (
                        <button key={p} onClick={() => setPlatformFilter(p)} className={`px-3 py-1 rounded-lg ${platformFilter === p ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>{p}</button>
                      ))}
                    </div>
                  </div>
                  <button onClick={exportToExcel} className="px-3 py-2 bg-emerald-700 text-white rounded-xl text-xs font-medium hover:bg-emerald-800">
                    匯出 Excel
                  </button>
                </div>

                {/* Wooden Bookshelf */}
                <div className="bg-[#EFE6D5] p-8 rounded-3xl border-4 border-[#C8B190] shadow-2xl">
                  <div className="text-xs font-bold text-amber-900/60 uppercase mb-4">Enterprise Smart Wooden Bookshelf • 擬真智能書櫃</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                    {filteredBooks.map(book => (
                      <div 
                        key={book.id}
                        onClick={() => { setSelectedBook(book); setIsReaderOpen(true); }}
                        className="group cursor-pointer flex flex-col items-center"
                      >
                        <div className={`w-40 h-56 rounded-r-xl rounded-l-md shadow-2xl bg-gradient-to-br ${book.coverColor} p-4 flex flex-col justify-between text-white transform transition duration-300 group-hover:-translate-y-2 border-l-4 border-black/30`}>
                          <div className="flex justify-between items-center text-[10px]">
                            <span className="bg-black/40 px-1.5 py-0.5 rounded">{book.platform}</span>
                            <span className={`px-1.5 py-0.5 rounded font-bold ${book.status === 'expired' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                              {book.status === 'expired' ? '逾期' : '已下載'}
                            </span>
                          </div>
                          <div>
                            <h3 className="font-bold text-sm leading-snug">{book.title}</h3>
                            <p className="text-[11px] text-white/80 mt-1">{book.author}</p>
                          </div>
                          <div className="text-[10px] border-t border-white/20 pt-2 flex justify-between">
                            <span>進度 {book.progress}%</span>
                            <span className="underline">點擊閱讀</span>
                          </div>
                        </div>
                        <div className="w-full h-3 bg-[#A88757] rounded-full shadow-inner mt-2 border-b border-[#7B613D]" />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'catalog' && (
              <div className="bg-white rounded-2xl border border-amber-200 p-6">
                <h3 className="font-bold text-slate-900 text-lg mb-4">電子書目錄清單 ({books.length} 本)</h3>
                <div className="space-y-3">
                  {books.map(b => (
                    <div key={b.id} className="p-3 bg-slate-50 rounded-xl flex justify-between items-center">
                      <div>
                        <div className="font-bold text-sm text-slate-900">{b.title}</div>
                        <div className="text-xs text-slate-500">{b.author} | {b.platform}</div>
                      </div>
                      <span className={`text-xs font-bold px-2 py-1 rounded ${b.status === 'expired' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                        {b.status === 'expired' ? '逾期' : '已下載'}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="bg-white rounded-2xl border border-amber-200 p-6">
                <h3 className="font-bold text-slate-900 text-lg mb-2">閱讀統計與數據分析</h3>
                <p className="text-sm text-slate-600">總藏書量: {books.length} 本 | 平均閱讀進度: {Math.round(books.reduce((acc,b)=>acc+b.progress,0)/books.length)}%</p>
              </div>
            )}

            {activeTab === 'exhibition' && (
              <div className="bg-slate-900 text-white p-8 rounded-3xl shadow-2xl">
                <h2 className="text-2xl font-extrabold mb-2">拿起即展示 Kiosk 模式</h2>
                <p className="text-sm text-slate-300">適用於展覽與大廳展示。</p>
              </div>
            )}
          </main>

          {/* Account Modal */}
          {isAccountModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">HyRead / momobook 帳號設定</h3>
                <p className="text-xs text-slate-500">已自動安全記憶憑證，點擊書籍即可直接自動驗證登入。</p>
                <button onClick={() => setIsAccountModalOpen(false)} className="w-full py-2 bg-amber-900 text-white rounded-xl text-xs font-medium">
                  儲存並關閉
                </button>
              </div>
            </div>
          )}

          {/* Reader Modal */}
          {isReaderOpen && selectedBook && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col">
              <div className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center border-b border-slate-800">
                <div>
                  <h3 className="font-bold text-base">{selectedBook.title}</h3>
                  <p className="text-xs text-slate-400">已自動記憶憑證登入 ({selectedBook.platform})</p>
                </div>
                <button onClick={() => setIsReaderOpen(false)} className="px-3 py-1 bg-slate-800 text-slate-200 rounded-lg text-xs">關閉閱讀</button>
              </div>
              <div className="flex-1 overflow-y-auto p-8 flex justify-center bg-[#FCF9F2] text-slate-900">
                <div className="max-w-2xl w-full space-y-6">
                  <div className="border-b pb-4">
                    <h4 className="font-bold text-amber-900 text-sm mb-1">書籍摘要</h4>
                    <p className="text-sm text-slate-700 leading-relaxed">{selectedBook.synopsis}</p>
                  </div>
                  <div className="space-y-3">
                    <h4 className="font-bold text-amber-900 text-sm">章節試讀</h4>
                    {selectedBook.chapters?.map((chap, idx) => (
                      <div key={idx} className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm text-xs leading-relaxed">
                        <strong className="block text-slate-900 mb-1">{chap}</strong>
                        此為 {selectedBook.platform} 電子書內容模擬器，已自動透過雲端完成認證並同步閱讀進度。
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the App component inside #root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
